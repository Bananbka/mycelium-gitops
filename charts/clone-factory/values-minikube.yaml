# Desired state for the minikube cluster. Argo CD reads this file from Git;
# change the image tags here (and only here) to release a new version.
imagePullPolicy: IfNotPresent

secret:
  # Created out of band (see README); no credentials live in Git.
  existingSecret: clone-factory-secret

migrate:
  argoHook: true

preUpgradeCheck:
  enabled: false

# Upstream registries no longer serve minio/minio, so a copy of the image used
# in labs 3-4 (minio-local:lab, id 14cea493d9a3) is published to GHCR.
minio:
  image:
    repository: ghcr.io/bananbka/clone-minio
    tag: "14cea493"

# Observability: ServiceMonitor (scraped by kube-prometheus-stack) and the
# Grafana dashboard ConfigMap (picked up by the Grafana sidecar).
metrics:
  enabled: true
  alerts:
    enabled: true      # PrometheusRule: >5% 5xx for 1m

# Progressive delivery: canary on 5 replicas (20% = 1 pod). No manual pause:
# after 20% the success-rate AnalysisRun decides whether to continue or abort.
rollout:
  enabled: true
  analysis:
    enabled: true
    prometheusAddress: http://kps-prometheus.monitoring:9090
    selector: 'namespace="clone-gitops"'
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {duration: 30s}         # let the metrics accumulate
        - analysis:
            templates:
              - templateName: clone-factory-success-rate
        - setWeight: 60
        - pause: {duration: 30s}

api:
  replicas: 5
  image:
    repository: ghcr.io/bananbka/clone-api
    tag: "1.8.0"
  env:
    - name: FAIL_RATE
      value: "0"
  # Smaller than the chart defaults so five replicas plus a canary pod fit
  # into the ~7.5 GB minikube node.
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 300m, memory: 256Mi}

celeryWorker:
  progressDeadlineSeconds: 60
  image:
    repository: ghcr.io/bananbka/clone-celery
    tag: "1.2.0"

celeryBeat:
  image:
    repository: ghcr.io/bananbka/clone-celery
    tag: "1.2.0"



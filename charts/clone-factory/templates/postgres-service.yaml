apiVersion: v1
kind: Service
metadata:
  name: {{ include "clone-factory.componentName" (dict "ctx" . "component" "postgres") }}
  labels:
    {{- include "clone-factory.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
  annotations:
    # Argo CD: Postgres and its config come up first (wave -2), then the
    # migration hook (wave -1), then everything else (wave 0).
    argocd.argoproj.io/sync-wave: "-2"
spec:
  type: ClusterIP
  selector:
    {{- include "clone-factory.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres

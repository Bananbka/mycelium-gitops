{{- if .Values.postgres.persistence.enabled }}
{{- $name := include "clone-factory.componentName" (dict "ctx" . "component" "postgres") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  labels:
    {{- include "clone-factory.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
  annotations:
    # Argo CD: Postgres and its config come up first (wave -2), then the
    # migration hook (wave -1), then everything else (wave 0).
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.postgres.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
{{- end }}

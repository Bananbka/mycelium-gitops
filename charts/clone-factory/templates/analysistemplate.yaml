{{- if .Values.rollout.analysis.enabled }}
{{- $sel := .Values.rollout.analysis.selector }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "clone-factory.fullname" . }}-success-rate
  labels:
    {{- include "clone-factory.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  metrics:
    - name: success-rate
      interval: 30s
      count: 4
      failureLimit: 0
      successCondition: result[0] >= 0.95
      provider:
        prometheus:
          address: {{ .Values.rollout.analysis.prometheusAddress }}
          query: |
            sum(rate(http_requests_total{ {{- $sel -}},status!~"5.."}[1m]))
            /
            sum(rate(http_requests_total{ {{- $sel -}} }[1m]))
{{- end }}

{{- if and .Values.metrics.enabled .Values.metrics.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "clone-factory.fullname" . }}-alerts
  labels:
    {{- include "clone-factory.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  groups:
    - name: clone-factory
      rules:
        - alert: CloneFactoryHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}",status=~"5.."}[1m]))
            / sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}"}[1m])) > 0.05
          for: 1m
          labels: {severity: warning}
          annotations:
            summary: "clone-factory: more than 5% of responses are 5xx"
{{- end }}

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clone-factory
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Bananbka/mycelium-gitops.git
    targetRevision: main
    path: charts/clone-factory
    helm:
      releaseName: clone-factory
      valueFiles:
        - values-minikube.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: clone-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    # If the app syncs before the Rollout CRD exists, try again instead of failing.
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
    syncOptions:
      - CreateNamespace=true

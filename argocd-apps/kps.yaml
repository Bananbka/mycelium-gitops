apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.11.0                # operator v0.94.1
    helm:
      valuesObject:
        fullnameOverride: kps

        # minikube control plane components cannot be scraped; disable to avoid noise
        kubeEtcd: {enabled: false}
        kubeControllerManager: {enabled: false}
        kubeScheduler: {enabled: false}
        kubeProxy: {enabled: false}
        # fewer moving parts: no admission webhook and its TLS jobs
        prometheusOperator:
          admissionWebhooks: {enabled: false}
          tls: {enabled: false}
        prometheus:
          prometheusSpec:
            retention: 2d
            # pick up ServiceMonitor / PodMonitor / PrometheusRule without a release label
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
        grafana:
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          sidecar:
            dashboards:
              searchNamespace: ALL         # look for dashboard ConfigMaps in every namespace
          additionalDataSources:
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki-gateway.monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true               # the chart's CRDs are too large for client-side apply
